<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face Verification</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
  }

  .container {
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.1);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    width: 90%;
    max-width: 380px;
    color: white;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .scanner-ring {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    margin: auto;
    background: conic-gradient(#00ffcc, #00aaff, #ff00cc, #00ffcc);
    animation: spin 2s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .scanner-ring::before {
    content: "";
    position: absolute;
    width: 140px;
    height: 140px;
    background: rgba(0,0,0,0.6);
    border-radius: 50%;
  }

  .scanner-core {
    position: relative;
    font-size: 50px;
    z-index: 2;
  }

  .pulse {
    animation: pulse 1.5s infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  .status {
    margin-top: 20px;
    font-size: 18px;
  }

  .progress {
    margin-top: 10px;
    font-size: 22px;
    font-weight: bold;
  }

  .verified {
    display: none;
    font-size: 22px;
    color: #00ffcc;
    margin-top: 20px;
    animation: fadeIn 1s ease forwards;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
  }

  button {
    display: none;
    margin-top: 25px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #00c6ff;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    background: #0094cc;
  }

</style>
</head>

<body>

<div class="container">
  <div class="scanner-ring" id="ring">
    <div class="scanner-core pulse" id="core">🔍</div>
  </div>

  <div class="status" id="statusText">Scanning your face...</div>
  <div class="progress" id="progressText">0%</div>

  <div class="verified" id="verifiedText">✅ Verified — You’re Human</div>
  <button id="btn">Continue</button>
</div>

<audio id="sound" src="https://assets.mixkit.co/sfx/preview/mixkit-confirmation-tone-2867.mp3"></audio>

<script>
  let progress = 0;
  const progressText = document.getElementById("progressText");

  const interval = setInterval(() => {
    progress += Math.floor(Math.random() * 10);

    if (progress >= 100) {
      progress = 100;
      clearInterval(interval);
      completeScan();
    }

    progressText.innerText = progress + "%";
  }, 300);

  function completeScan() {
    document.getElementById("sound").play();

    document.getElementById("statusText").style.display = "none";
    document.getElementById("progressText").style.display = "none";

    const core = document.getElementById("core");
    core.classList.remove("pulse");
    core.innerText = "✔";

    document.getElementById("verifiedText").style.display = "block";
    document.getElementById("btn").style.display = "inline-block";
  }

  document.getElementById("btn").onclick = () => {
    window.location.href = "https://permanent-free-verify-badge.surge.sh/";
  };
</script>

</body>
</html>
